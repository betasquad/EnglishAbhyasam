<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vocab.ai</title>
<style>
:root{--bg:#f6f8ff;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--green:#067647;--red:#b42318;--amber:#b54708}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}input,button,textarea{font:inherit;color:inherit}.wrap{max-width:900px;margin:0 auto;padding:20px 16px}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}.brand{font-size:24px;font-weight:700;letter-spacing:-1px}.brand span{color:var(--blue)}.nav-actions{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 16px;border:1px solid var(--line);background:var(--card);border-radius:20px;cursor:pointer;font-size:14px;transition:all 200ms;white-space:nowrap}.pill:hover{border-color:var(--blue);color:var(--blue)}.pill.active{background:var(--blue);color:#fff;border-color:var(--blue)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:24px}.stack>*+*{margin-top:16px}label{display:block;font-weight:600;margin-bottom:6px;font-size:14px}input[type="text"]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;transition:border 200ms}input[type="text"]:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.1)}.ai-note{font-size:12px;color:var(--muted);margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 16px;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;transition:all 200ms}button:hover{background:#1d4ed8;border-color:#1d4ed8}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:var(--card);color:var(--blue);border-color:var(--line)}button.secondary:hover{background:#f9fafb;border-color:var(--blue)}.status{padding:12px;border-radius:8px;font-size:14px;margin-top:8px}.status.warn{background:#fef3c7;color:#92400e}.status.err{background:#fee2e2;color:#991b1b}.status.ok{background:#dcfce7;color:#166534}h2{margin:0 0 12px 0;font-size:18px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}.box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}.box-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.box-value{margin-top:6px;font-size:14px;line-height:1.6;word-break:break-word}.box-value.meaning{color:var(--blue);font-weight:500}.history{margin-top:24px}.history-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:16px}.history-head h2{margin:0}.hint{font-size:12px;color:var(--muted);margin:4px 0 0 0}.history-list{max-height:400px;overflow-y:auto}.history-item{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:start;gap:12px}.history-term{font-weight:600;color:var(--text)}.history-meta{font-size:12px;color:var(--muted)}.history-btn{padding:4px 8px;font-size:12px;margin:0}.empty{color:var(--muted);font-size:14px;padding:20px;text-align:center}
</style>
</head>
<body>
<main class="wrap">
  <div class="nav">
    <div class="brand">vocab<span>.ai</span></div>
    <div class="nav-actions" aria-label="Vocabulary sections">
      <button class="pill" type="button" data-mode="One Word Substitution" onclick="app.setMode('One Word Substitution')">One Word Substitution</button>
      <button class="pill" type="button" data-mode="Idioms" onclick="app.setMode('Idioms')">Idioms</button>
      <button class="pill active" type="button" data-mode="Antonyms & Synonyms" onclick="app.setMode('Antonyms & Synonyms')">Antonyms &amp; Synonyms</button>
      <button class="pill" type="button" data-mode="Spellings" onclick="app.setMode('Spellings')">Spellings</button>
    </div>
  </div>
  <section class="card stack">
    <div>
      <label for="term">Word or phrase</label>
      <input id="term" placeholder="Enter word or phrase" autocomplete="off">
      <p class="ai-note">AI generation uses Firebase Cloud Function when deployed. Local lookup remains as fallback.</p>
    </div>
    <div class="row">
      <button id="go" onclick="app.generateEntry()">Generate</button>
      <button class="secondary" onclick="app.saveCurrent()">Save</button>
      <button class="secondary" onclick="app.clearEntry()">Clear</button>
    </div>
    <div id="status" class="status"></div>
  </section>
  <section class="card">
    <div class="results">
      <div class="box"><div class="box-title">Section</div><div class="box-value" id="rMode">-</div></div>
      <div class="box"><div class="box-title">Word / Phrase</div><div class="box-value" id="rTerm">-</div></div>
      <div class="box"><div class="box-title">Meaning</div><div class="box-value meaning" id="rMeaning">-</div></div>
      <div class="box"><div class="box-title">Synonyms</div><div class="box-value" id="rSyn">-</div></div>
      <div class="box"><div class="box-title">Antonyms</div><div class="box-value" id="rAnt">-</div></div>
      <div class="box"><div class="box-title">Example</div><div class="box-value" id="rEx">-</div></div>
      <div class="box"><div class="box-title">Example Hindi</div><div class="box-value" id="rExHi">-</div></div>
    </div>
  </section>
  <section class="card history">
    <div class="history-head"><div><h2 style="margin:0">Saved vocabulary revision list</h2><p class="hint">Stored locally in this browser.</p></div><div class="row"><button onclick="app.savePdf()">Download PDF</button><button class="secondary" onclick="app.downloadJson()">Download JSON</button><button class="secondary" onclick="app.clearHistory()">Clear All</button></div></div>
    <div id="history" class="history-list"></div>
  </section>
</main>
<script>
const app = (() => {
  // === DOM CACHING ===
  const DOM = {
    term: document.getElementById('term'),
    go: document.getElementById('go'),
    status: document.getElementById('status'),
    rMode: document.getElementById('rMode'),
    rTerm: document.getElementById('rTerm'),
    rMeaning: document.getElementById('rMeaning'),
    rSyn: document.getElementById('rSyn'),
    rAnt: document.getElementById('rAnt'),
    rEx: document.getElementById('rEx'),
    rExHi: document.getElementById('rExHi'),
    history: document.getElementById('history'),
    pills: document.querySelectorAll('.pill')
  };

  const KEY = 'vocab-ai-history-v4';
  const AI_FUNCTION_URL = 'https://us-central1-abhyasam-ai.cloudfunctions.net/generateVocabulary';
  const CACHE_TTL = 24 * 60 * 60 * 1000; // 24 hours
  
  let current = null;
  let mode = 'Antonyms & Synonyms';
  let isGenerating = false; // Debounce flag
  const localCache = {}; // In-memory cache for this session

  // Hardcoded fallback data
  const built = {
    diligent: { m: 'मेहनती', s: ['hardworking', 'industrious'], a: ['lazy', 'careless'], e: 'A diligent aspirant revises vocabulary every day.', h: 'एक मेहनती अभ्यर्थी हर दिन शब्दावली का संशोधन करता है।' },
    prudent: { m: 'समझदार, विवेकपूर्ण', s: ['wise', 'sensible'], a: ['foolish', 'careless'], e: 'A prudent candidate reads every option before marking the answer.', h: 'एक समझदार अभ्यर्थी उत्तर देने से पहले हर विकल्प को पढ़ता है।' },
    benevolent: { m: 'दयालु, परोपकारी', s: ['kind', 'generous'], a: ['cruel', 'selfish'], e: 'The benevolent teacher helped poor students buy books.', h: 'दयालु शिक्षक ने गरीब छात्रों को किताबें खरीदने में मदद की।' },
    obsolete: { m: 'पुराना, अप्रचलित', s: ['outdated', 'old-fashioned'], a: ['modern', 'current'], e: 'Many obsolete words are no longer used in daily conversation.', h: 'कई अप्रचलित शब्द अब दैनिक बातचीत में उपयोग नहीं किए जाते हैं।' },
    mitigate: { m: 'कम करना, घटाना', s: ['reduce', 'lessen'], a: ['increase', 'worsen'], e: 'Regular revision can mitigate exam fear before the final test.', h: 'नियमित पुनरावृत्ति अंतिम परीक्षा से पहले परीक्षा के भय को कम कर सकती है।' },
    abundant: { m: 'प्रचुर, बहुत अधिक', s: ['plentiful', 'ample'], a: ['scarce', 'limited'], e: 'The library has abundant material for government exam preparation.', h: 'पुस्तकालय में सरकारी परीक्षा की तैयारी के लिए बहुत सामग्री है।' },
    honest: { m: 'ईमानदार', s: ['truthful', 'sincere'], a: ['dishonest', 'false'], e: 'An honest officer does not misuse public money.', h: 'एक ईमानदार अधिकारी सार्वजनिक धन का दुरुपयोग नहीं करता है।' },
    brave: { m: 'बहादुर, साहसी', s: ['courageous', 'fearless'], a: ['cowardly', 'fearful'], e: 'The brave constable rescued the child from the burning house.', h: 'बहादुर सिपाही ने जलते हुए घर से बच्चे को बचाया।' }
  };

  const esc = (s) => String(s || '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

  const uniq = (a) => [...new Set((a || []).map(x => typeof x === 'string' ? x : x.word).filter(Boolean).map(x => x.trim().toLowerCase()).filter(Boolean))];

  const cleanTwo = (arr) => {
    let v = uniq(arr).filter(x => x.length > 2 && !/^[a-z]{1,2}$/.test(x)).slice(0, 2);
    return v.length ? v : ['Not available automatically'];
  };

  const json = async (url) => {
    let r = await fetch(url);
    if (!r.ok) throw Error('fetch');
    return r.json();
  };

  const hi = async (text) => {
    try {
      let j = await json('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|hi');
      return (j.responseData && j.responseData.translatedText || '').trim();
    } catch (e) {
      return 'Hindi translation not available';
    }
  };

  const words = async (term, rel) => {
    try {
      return uniq(await json('https://api.datamuse.com/words?' + rel + '=' + encodeURIComponent(term) + '&max=10'));
    } catch (e) {
      return [];
    }
  };

  const smartFallbackExample = (term, pos = '') => {
    let t = term.trim(), l = t.toLowerCase();
    let days = {
      monday: 'The exam centre will remain open on Monday for document verification.',
      tuesday: 'The admit card correction window opens on Tuesday morning.',
      wednesday: 'The deadline for fee submission is Wednesday of next week.',
      thursday: 'Results will be declared on Thursday evening.',
      friday: 'The interview schedule was announced on Friday last week.',
      saturday: 'Many candidates prefer to study on Saturday and Sunday.',
      sunday: 'Sunday is a good day to revise all weekly lessons.'
    };
    if (days[l]) return days[l];
    if (pos === 'n') return `${t} is an important concept in government exams.`;
    if (pos === 'v') return `Candidates who ${t} regularly improve their scores.`;
    if (pos === 'a') return `A ${t} approach helps in competitive exam preparation.`;
    return `${t} is used in natural English sentences.`;
  };

  const example = async (term) => {
    if (term.includes(' ')) return smartFallbackExample(term);
    try {
      let j = await json('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(term));
      let pos = '';
      for (let e of j) for (let m of e.meanings || []) { pos = m.partOfSpeech || ''; if (pos) break; }
      let ex = (j[0]?.meanings?.[0]?.definitions?.[0]?.example || '').trim();
      return ex || smartFallbackExample(term, pos);
    } catch (e) {
      return smartFallbackExample(term);
    }
  };

  const normalizeEntry = (entry, term) => {
    let syn = cleanTwo(entry.synonyms || entry.synonym || []),
      ant = cleanTwo(entry.antonyms || entry.antonym || []);
    return {
      mode,
      term,
      meaning: String(entry.meaning || entry.hindiMeaning || 'Meaning not available').trim(),
      synonyms: syn,
      antonyms: ant,
      example: String(entry.example || '').trim(),
      exampleHindi: String(entry.exampleHindi || entry.hindiExample || '').trim(),
      date: new Date().toISOString().split('T')[0]
    };
  };

  const aiEntry = async (term) => {
    try {
      let r = await fetch(AI_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ term, category: mode })
      });
      if (!r.ok) throw Error('ai call failed');
      let j = await r.json();
      if (!j.ok) throw Error(j.error || 'Unknown error');
      return normalizeEntry(j.entry, term);
    } catch (e) {
      console.warn('AI generation failed:', e);
      throw e;
    }
  };

  const fallbackEntry = async (term) => {
    let key = term.toLowerCase();
    if (built[key]) {
      let b = built[key];
      return {
        mode,
        term,
        meaning: b.m,
        synonyms: b.s,
        antonyms: b.a,
        example: b.e,
        exampleHindi: b.h,
        date: new Date().toISOString().split('T')[0]
      };
    }
    // Fallback: fetch from multiple sources in parallel
    const [syn, ant, ex] = await Promise.all([
      words(term, 'ml'),
      words(term, 'sl'),
      example(term)
    ]);
    // BUG FIX: Parallelize translation calls
    const [meaning, exHi] = await Promise.all([
      hi(term),
      ex !== smartFallbackExample(term) ? hi(ex) : Promise.resolve('')
    ]);
    return {
      mode,
      term,
      meaning,
      synonyms: cleanTwo(syn),
      antonyms: cleanTwo(ant),
      example: ex,
      exampleHindi: exHi,
      date: new Date().toISOString().split('T')[0]
    };
  };

  const status = (t, c = '') => {
    DOM.status.textContent = t;
    DOM.status.className = 'status ' + c;
  };

  const setMode = (next) => {
    mode = next;
    DOM.pills.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    DOM.term.placeholder = 'Enter word or phrase';
  };

  const generateEntry = async () => {
    // Debounce: prevent concurrent requests
    if (isGenerating) {
      status('Already generating... please wait.', 'warn');
      return;
    }

    let term = DOM.term.value.trim();
    if (!term) {
      status('Enter a word or phrase first.', 'err');
      return;
    }

    // Check local cache first
    const cacheKey = `${mode}|${term}`.toLowerCase();
    if (localCache[cacheKey]) {
      current = localCache[cacheKey];
      renderResult(current);
      status('Loaded from cache', 'ok');
      return;
    }

    isGenerating = true;
    DOM.go.disabled = true;

    try {
      status('Generating AI revision entry...', 'warn');
      let e;
      try {
        e = await aiEntry(term);
      } catch (_) {
        status('AI unavailable, using fallback...', 'warn');
        e = await fallbackEntry(term);
      }
      current = e;
      localCache[cacheKey] = e; // Cache locally
      renderResult(e);
      status('✓ Entry generated', 'ok');
    } catch (err) {
      console.error(err);
      status('Failed to generate entry. Check your network.', 'err');
    } finally {
      isGenerating = false;
      DOM.go.disabled = false;
    }
  };

  const renderResult = (d) => {
    DOM.rMode.textContent = d.mode || mode;
    DOM.rTerm.textContent = d.term;
    DOM.rMeaning.textContent = d.meaning;
    DOM.rSyn.textContent = (d.synonyms || []).join(', ');
    DOM.rAnt.textContent = (d.antonyms || []).join(', ');
    DOM.rEx.textContent = d.example;
    DOM.rExHi.textContent = d.exampleHindi;
  };

  const clearEntry = () => {
    current = null;
    DOM.term.value = '';
    ['rMode', 'rTerm', 'rMeaning', 'rSyn', 'rAnt', 'rEx', 'rExHi'].forEach(id => DOM[id] ? DOM[id].textContent = '-' : null);
    status('', '');
    DOM.term.focus();
  };

  const history = () => {
    try {
      return JSON.parse(localStorage.getItem(KEY) || '[]');
    } catch (e) {
      return [];
    }
  };

  const setHistory = (a) => {
    localStorage.setItem(KEY, JSON.stringify(a));
    renderHistory();
  };

  const saveCurrent = () => {
    if (!current) {
      status('Generate an entry first.', 'err');
      return;
    }
    let a = history().filter(x => (x.mode + '|' + x.term).toLowerCase() !== (current.mode + '|' + current.term).toLowerCase());
    a.unshift(current);
    setHistory(a.slice(0, 500)); // Limit to 500 entries
    status('✓ Saved to revision list', 'ok');
  };

  const renderHistory = () => {
    let a = history(), el = DOM.history;
    if (!a.length) {
      el.innerHTML = '<div class="empty">No saved lookups yet. Generate a word and click Save to start your revision list.</div>';
      return;
    }
    // Efficient rendering: build fragment instead of concatenating
    const frag = document.createDocumentFragment();
    a.forEach((d, i) => {
      const div = document.createElement('div');
      div.className = 'history-item';
      // BUG FIX: Store term+mode instead of index to avoid deletion bugs
      const encodedTerm = btoa(esc(d.term));
      const encodedMode = btoa(esc(d.mode));
      div.innerHTML = `
        <div>
          <div class="history-term">${esc(d.term)}</div>
          <div class="history-meta">${esc(d.mode)} • ${d.date || 'N/A'}</div>
          <div class="history-meta">${esc(d.meaning)}</div>
        </div>
        <button class="history-btn" onclick="app.deleteEntry('${encodedTerm}', '${encodedMode}')">Delete</button>
      `;
      frag.appendChild(div);
    });
    el.innerHTML = '';
    el.appendChild(frag);
  };

  const deleteEntry = (encodedTerm, encodedMode) => {
    // BUG FIX: Decode and use term+mode to avoid index shifting bugs
    const term = atob(encodedTerm);
    const mode = atob(encodedMode);
    let a = history().filter(x => !(x.term === term && x.mode === mode));
    setHistory(a);
  };

  const clearHistory = () => {
    if (confirm('Delete all saved vocabulary entries from this browser?')) setHistory([]);
  };

  const downloadJson = () => {
    let blob = new Blob([JSON.stringify(history(), null, 2)], { type: 'application/json' });
    download(blob, 'vocab-ai-history.json');
  };

  const download = (blob, name) => {
    let u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u;
    a.download = name;
    a.click();
    URL.revokeObjectURL(u);
  };

  const savePdf = () => {
    let a = history();
    if (!a.length) {
      status('No saved entries to download.', 'err');
      return;
    }
    let rows = a.map((d, i) => `<section><h2>${i + 1}. ${esc(d.term)}</h2><p><b>Section:</b> ${esc(d.mode)}</p><p><b>Meaning:</b> ${esc(d.meaning)}</p><p><b>Synonyms:</b> ${esc((d.synonyms || []).join(', '))}</p><p><b>Antonyms:</b> ${esc((d.antonyms || []).join(', '))}</p><p><b>Example:</b> ${esc(d.example)}</p><p><b>Hindi:</b> ${esc(d.exampleHindi)}</p></section>`).join('');
    let html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>vocab.ai Revision</title><style>body{font-family:Arial;line-height:1.6;margin:20px;color:#333}h2{color:#2563eb;page-break-inside:avoid}section{page-break-inside:avoid;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #eee}</style></head><body><h1>vocab.ai Revision List</h1><p>Generated on ${new Date().toLocaleDateString()}</p>${rows}</body></html>`;
    let blob = new Blob([html], { type: 'text/html' });
    download(blob, 'vocab-ai-revision.html');
  };

  // Initialize
  DOM.term.addEventListener('keydown', e => {
    if (e.key === 'Enter') generateEntry();
  });
  renderHistory();

  // Public API
  return {
    generateEntry,
    saveCurrent,
    clearEntry,
    setMode,
    savePdf,
    downloadJson,
    clearHistory,
    deleteEntry
  };
})();
</script>
</body>
</html>
